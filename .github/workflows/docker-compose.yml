name: docker-compose

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compilar backend con mvnw package (incluye tests)
        run: cd backend && ./mvnw -B -q package

      - name: Construir y levantar servicios
        run: docker compose up -d --build

      - name: Esperar al backend (BD y RabbitMQ UP)
        run: |
          for i in $(seq 1 60); do
            h=$(curl -fs http://localhost:8080/actuator/health) && echo "$h" | grep -q '"rabbit":{"status":"UP"' && echo "$h" | grep -q '"db":{"status":"UP"' && echo "$h" && exit 0
            sleep 3
          done
          exit 1

      - name: Probar API y OpenAPI
        run: |
          curl -fs -X POST http://localhost:8080/api/pagos \
            -H "Content-Type: application/json" \
            -d '{"monto":150.75,"moneda":"USD"}'
          curl -fs http://localhost:8080/api/pagos | grep PENDIENTE
          curl -fs http://localhost:8080/v3/api-docs | grep "Autorización de Pagos API"
          curl -fsL -o /dev/null http://localhost:8080/swagger-ui.html

      - name: Probar RabbitMQ (cola declarada)
        run: curl -fs -u pagos:pagos http://localhost:15672/api/queues/%2F/pagos.autorizaciones

      - name: Probar frontend y proxy /api
        run: |
          curl -fs http://localhost:3000 | grep "<title>Autorización de Pagos</title>"
          curl -fs http://localhost:3000/api/pagos | grep PENDIENTE

      - name: Estado y logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Detener servicios
        if: always()
        run: docker compose down -v
