spring.application.name=autorizacion
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:pagos}
spring.datasource.username=${POSTGRES_USER:pagos}
spring.datasource.password=${POSTGRES_PASSWORD:pagos}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:pagos}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:pagos}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always

springdoc.swagger-ui.path=/swagger-ui.html
